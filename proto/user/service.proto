syntax = "proto3";

package userservice;

option go_package = "github.com/RealTimeMap/RealTimeMap-backend/pkg/pb/user";

service UserService{
  rpc GetUserById(UserRequest) returns (UserResponse) {}
}

message UserRequest {
  int64 id = 1;
}

message UserResponse {
  int64 id = 1;
  string username = 2;
  string email = 3;
  bool is_superuser = 4;
}
