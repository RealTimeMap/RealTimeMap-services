services:
  traefik:
    image: traefik:v3.6.1
    environment:
      - DOCKER_API_VERSION=1.45
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /etc/letsencrypt/live/realtimemap.ru:/etc/letsencrypt/live/realtimemap.ru:ro
      - /etc/letsencrypt/archive/realtimemap.ru:/etc/letsencrypt/archive/realtimemap.ru:ro
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "3"
    networks:
      - web

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - service-network

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: rtm_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - service-network

  minio:
    image: minio/minio:latest
    container_name: rtm_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    labels:
      - "traefik.enable=true"

      # Раздача медиафайлов: /files/v1/... -> бакет rtm-media.
      # Бакет публичен на чтение только для префикса v1/ (см. minio-init),
      # поэтому auth-check здесь намеренно не подключён.
      - "traefik.http.routers.media-public.rule=Host(`realtimemap.ru`) && PathPrefix(`/files/`)"
      - "traefik.http.routers.media-public.entrypoints=websecure"
      - "traefik.http.routers.media-public.priority=100"
      - "traefik.http.routers.media-public.service=media"
      - "traefik.http.routers.media-public.middlewares=cors-headers@file,media-path"
      - "traefik.http.routers.media-public.tls=true"

      # /files/v1/ab/cd/<hash>.jpg -> /rtm-media/v1/ab/cd/<hash>.jpg
      - "traefik.http.middlewares.media-path.replacepathregex.regex=^/files/(.*)"
      - "traefik.http.middlewares.media-path.replacepathregex.replacement=/rtm-media/$$1"


      - "traefik.http.services.media.loadbalancer.server.port=9000"
    networks:
      # service-network — доступ из Go-сервисов; web — раздача через traefik
      # (providers.docker.network: web в traefik.yml)
      - service-network
      - web

  # Одноразовая инициализация: создаёт бакет и открывает публичное чтение
  # префикса v1/. Без неё бакета не будет, и NewMinIOStorage упадёт на старте.
  minio-init:
    image: minio/mc:latest
    container_name: rtm_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set download local/$$MINIO_BUCKET/v1 &&
      echo 'minio bucket ready'
      "
    networks:
      - service-network

volumes:
  redis_data:
  postgres_data:
  minio_data:

networks:
  web:
    external: true
  service-network:
    external: true
    name: service-network