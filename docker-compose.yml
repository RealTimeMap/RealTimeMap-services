include:
  - services/mark-service/docker-compose.yml
  - services/comment-service/docker-compose.yml
  - services/feedback-service/docker-compose.yml
  - services/gamification-service/docker-compose.yml
  - services/smtp-service/docker-compose.yml
  - services/social-service/docker-compose.yml
  - services/notification-service/docker-compose.yml
#  - docker-compose.kafka.yml

services:
  traefik:
    image: traefik:v3.6.1
    environment:
      - DOCKER_API_VERSION=1.45
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /etc/letsencrypt/live/realtimemap.ru:/etc/letsencrypt/live/realtimemap.ru:ro
      - /etc/letsencrypt/archive/realtimemap.ru:/etc/letsencrypt/archive/realtimemap.ru:ro
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "3"
    networks:
      - web

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - service-network

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: rtm_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - service-network

  # SeaweedFS вместо MinIO: MinIO перестала публиковать open-source образы.
  # weed mini — master + volume + filer + S3 в одном процессе, для одной ноды
  # этого достаточно. Наружу нужен только S3 (8333).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: rtm_seaweedfs
    restart: unless-stopped
    # .env compose использует только для подстановки ${...} в этом файле —
    # внутрь контейнера он не попадает. Всё, что читает entrypoint, нужно
    # передать явно.
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # weed mini сам создаёт бакет на старте, если его нет.
      S3_BUCKET: ${S3_BUCKET}
      # Вход в Admin UI (23646). weed mini слушает его на всех интерфейсах, так
      # что без пароля он открыт любому контейнеру в service-network и web.
      WEED_ADMIN_USER: ${SEAWEEDFS_ADMIN_USER:-admin}
      WEED_ADMIN_PASSWORD: ${SEAWEEDFS_ADMIN_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /etc/seaweedfs/s3.json <<EOF
        {
          "identities": [
            {
              "name": "anonymous",
              "actions": ["Read:$${S3_BUCKET}/v1/*"]
            },
            {
              "name": "admin",
              "credentials": [{"accessKey": "$${S3_ACCESS_KEY}", "secretKey": "$${S3_SECRET_KEY}"}],
              "actions": ["Admin", "Read", "List", "Tagging", "Write"]
            }
          ]
        }
        EOF
        exec weed mini -dir=/data -s3.config=/etc/seaweedfs/s3.json
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
    labels:
      - "traefik.enable=true"

      # Раздача медиафайлов: /files/v1/... -> бакет rtm-media.
      # Анонимно читается только префикс v1/ (см. s3.json выше),
      # поэтому auth-check здесь намеренно не подключён.
      - "traefik.http.routers.media-public.rule=Host(`realtimemap.ru`) && PathPrefix(`/files/`)"
      - "traefik.http.routers.media-public.entrypoints=websecure"
      - "traefik.http.routers.media-public.priority=100"
      - "traefik.http.routers.media-public.service=media"
      - "traefik.http.routers.media-public.middlewares=cors-headers@file,media-path,media-cache"
      - "traefik.http.routers.media-public.tls=true"
      - "traefik.http.middlewares.media-cache.headers.customresponseheaders.Cache-Control=public, max-age=31536000, immutable"

      # /files/v1/ab/cd/<hash>.jpg -> /rtm-media/v1/ab/cd/<hash>.jpg
      - "traefik.http.middlewares.media-path.replacepathregex.regex=^/files/(.*)"
      - "traefik.http.middlewares.media-path.replacepathregex.replacement=/rtm-media/$$1"


      - "traefik.http.services.media.loadbalancer.server.port=8333"
    networks:
      # service-network — доступ из Go-сервисов; web — раздача через traefik
      # (providers.docker.network: web в traefik.yml)
      - service-network
      - web

volumes:
  redis_data:
  postgres_data:
  seaweedfs_data:

networks:
  web:
    external: true
  service-network:
    external: true
    name: service-network
