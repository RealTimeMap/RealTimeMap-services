http:
  routers:
    auth-public:
      rule: "Host(`realtimemap.ru`) && (PathPrefix(`/api/v2/auth/`) || PathPrefix(`/api/v2/user/`) || PathPrefix(`/admin/`) || PathPrefix(`/static/`) || PathPrefix(`/api/v2/sessions/`))"
      entryPoints:
        - websecure
      service: auth-service
      middlewares:
        - cors-headers
      priority: 100
      tls: {}

    sessions-options:
      rule: "Host(`realtimemap.ru`) && PathPrefix(`/api/v2/sessions`) && Method(`OPTIONS`)"
      entryPoints:
        - websecure
      service: auth-service
      middlewares:
        - cors-headers
      priority: 210
      tls: {}

    sessions:
      rule: "Host(`realtimemap.ru`) && PathPrefix(`/api/v2/sessions`)"
      entryPoints:
        - websecure
      service: auth-service
      middlewares:
        - cors-headers
        - auth-check
      priority: 100
      tls: {}

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://realtime-map-backend:8001"

    rttask-service:
      loadBalancer:
        servers:
          - url: "http://service-rttask:8080"

  middlewares:
    # CORS headers middleware
    cors-headers:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "DELETE"
          - "HEAD"
          - "OPTIONS"
        accessControlAllowOriginListRegex:
          - "^http://localhost:[0-9]+$"
        accessControlAllowOriginList:
          - "https://real-time-map-frontend.vercel.app"
          - "https://realtimemap.ru"
          - "https://localhost"
          - "capacitor://localhost"
          - "https://docs.realtimemap.ru"
          - "https://task.realtimemap.ru"
          - "http://127.0.0.1:5173"
        accessControlAllowHeaders:
          - "Origin"
          - "Content-Type"
          - "Access-Control-Allow-Origin"
          - "Accept"
          - "Authorization"
          - "X-User-Id"
          - "X-User-Name"
          - "X-User-Anonymous"
          - "X-User-Admin"
          - "X-Trace-Id"
          - "X-User-Ban"
          - "X-User-Ban-Reason"
          - "X-User-Ban-Detail"
          - "X-User-Ban-Time"
        accessControlExposeHeaders:
          - "Content-Length"
          - "Authorization"
        accessControlAllowCredentials: true
        accessControlMaxAge: 43200
        # Добавь это для preflight
        addVaryHeader: true

    # ForwardAuth middleware для проверки Bearer токена
    # auth-service вернет 401 если токен невалиден
    # Traefik автоматически проксирует эту ошибку клиенту
    auth-check:
      forwardAuth:
        address: "http://realtime-map-backend:8001/api/v2/auth/token-validate"
        authResponseHeaders:
          - "X-User-Id"
          - "X-User-Name"
          - "X-User-Ban"
          - "X-User-Admin"
          - "X-User-Anonymous"
          - "X-User-Ban-Reason"
          - "X-User-Ban-Detail"
          - "X-User-Ban-Time"
        authRequestHeaders:
          - "Authorization"
    # ForwardAuth для публичных маршрутов, где авторизация необязательна.
    # В отличие от auth-check всегда отвечает 200: аноним — не ошибка.
    # Заголовки X-User-* проставляются только при валидном токене, поэтому
    # pkg/middleware/auth.AuthOptional корректно отличает гостя от юзера.
    auth-optional:
      forwardAuth:
        address: "http://realtime-map-backend:8001/api/v2/auth/token-validate-optional"
        authResponseHeaders:
          - "X-User-Id"
          - "X-User-Name"
          - "X-User-Ban"
          - "X-User-Admin"
          - "X-User-Anonymous"
          - "X-User-Ban-Reason"
          - "X-User-Ban-Detail"
          - "X-User-Ban-Time"
        authRequestHeaders:
          - "Authorization"
    strip-rttask:
      stripPrefix:
        prefixes:
          - "/rttask"
tls:
  certificates:
    - certFile: /etc/letsencrypt/live/realtimemap.ru/fullchain.pem
      keyFile: /etc/letsencrypt/live/realtimemap.ru/privkey.pem

  stores:
    default:
      defaultCertificate:
        certFile: /etc/letsencrypt/live/realtimemap.ru/fullchain.pem
        keyFile: /etc/letsencrypt/live/realtimemap.ru/privkey.pem
