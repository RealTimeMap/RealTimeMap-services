api:
  insecure: true
  dashboard: true

entryPoints:
  web:
    address: ":82"
    # Редирект на HTTPS (раскомментируйте если нужно)
    # http:
    #   redirections:
    #     entryPoint:
    #       to: websecure
    #       scheme: https

  websecure:
    address: ":443"
    http3: {}
    http:
      middlewares:
        - compress@file

  metrics:
    address: ":8082"

log:
  # DEBUG пишет по несколько строк на каждый запрос — на проде это лишний CPU и
  # объём в Loki. Для разбора проблем временно поднимать до DEBUG.
  level: INFO

accessLog:
  format: common

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

providers:
  docker:
    exposedByDefault: false
    network: web
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
