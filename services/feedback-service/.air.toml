root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main.exe ./cmd/feedback-service"
  bin = "./tmp/main.exe"
  include_ext = ["go", "yaml", "yml"]
  exclude_dir = ["tmp", "store", "docs"]
  delay = 1000  # мс, задержка перед пересборкой
  stop_on_error = true

[misc]
  clean_on_exit = true