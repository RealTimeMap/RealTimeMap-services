# Пример конфигурации для локальной разработки (без Docker)
# Для Docker окружения используйте docker.config.yaml или ENV переменные
#
# Приоритет загрузки конфигурации:
# 1. ENV переменные (highest) - например: DB_HOST=postgres DB_PASSWORD=secret
# 2. config.yaml файл
# 3. env-default значения из структур config

ENV: "dev"

database:
  host: "localhost"         # Для локальной разработки
  port: 5432                # ENV: DB_PORT
  user: "postgres"          # ENV: DB_USER
  password: "admin"         # ENV: DB_PASSWORD (используйте secrets для production!)
  db_name: "realtimemap_marks"  # ENV: DB_NAME
  ssl_mode: "disable"       # ENV: DB_SSL_MODE

grpc:
  user_service: "localhost:50052"  # Для Docker: "user-service:50051"

storage:
  # Локальный запуск: сервис на хосте, MinIO в докере с пробросом 9000.
  # В докере значение переопределяется через ENV STORAGE_ENDPOINT=rtm_minio:9000.
  endpoint: "localhost:9000"
  bucket: "rtm-media"
  access_key_id: ""       # ENV: STORAGE_ACCESS_KEY_ID (не коммитить)
  secret_access_key: ""   # ENV: STORAGE_SECRET_ACCESS_KEY (не коммитить)
  region: "us-east-1"
  use_ssl: false
  # base_url обязан совпадать во ВСЕХ сервисах одного окружения: иначе один и
  # тот же объект получит разные URL и дедупликация потеряет смысл на выдаче.
  # Прод/докер: https://realtimemap.ru/files (ENV STORAGE_BASE_URL).
  base_url: "http://localhost:9000/rtm-media"

kafka:
  enabled: false            # ENV: KAFKA_ENABLED (false для dev без Kafka)
  brokers:
    - "localhost:9092"      # Для локальной разработки | Docker: "kafka:29092"
  producerTopic: "mark_action-service.events"  # ENV: KAFKA_PRODUCER_TOPIC
