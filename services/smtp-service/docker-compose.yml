services:

  smtp-service:
    image: ghcr.io/realtimemap/smtp-service:${TAG:-latest}
    build:
      context: ../..
      dockerfile: build/Dockerfile
      args:
        SERVICE: smtp-service
    container_name: smtp-service
    restart: always
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "3"
    labels:
      - "traefik.enable=true"

      # CORS preflight для ручек сервиса
      - "traefik.http.routers.smtp-options.rule=Host(`realtimemap.ru`) && (PathPrefix(`/api/v2/emails/`) || PathPrefix(`/api/v2/service/`) || PathPrefix(`/api/v2/keys/`)) && Method(`OPTIONS`)"
      - "traefik.http.routers.smtp-options.entrypoints=websecure"
      - "traefik.http.routers.smtp-options.priority=200"
      - "traefik.http.routers.smtp-options.service=smtp"
      - "traefik.http.routers.smtp-options.middlewares=cors-headers@file"
      - "traefik.http.routers.smtp-options.tls=true"

      # /api/v2/emails/admin[/*] — отправка и просмотр писем.
      - "traefik.http.routers.smtp-admin.rule=Host(`realtimemap.ru`) && PathRegexp(`^/api/v2/emails/admin(/.*)?$`)"
      - "traefik.http.routers.smtp-admin.entrypoints=websecure"
      - "traefik.http.routers.smtp-admin.priority=100"
      - "traefik.http.routers.smtp-admin.service=smtp"
      - "traefik.http.routers.smtp-admin.middlewares=cors-headers@file,auth-check@file"
      - "traefik.http.routers.smtp-admin.tls=true"

      # POST /api/v2/keys/create — выпуск API-ключей, тоже под администратором.
      - "traefik.http.routers.smtp-keys.rule=Host(`realtimemap.ru`) && PathPrefix(`/api/v2/keys/`)"
      - "traefik.http.routers.smtp-keys.entrypoints=websecure"
      - "traefik.http.routers.smtp-keys.priority=100"
      - "traefik.http.routers.smtp-keys.service=smtp"
      - "traefik.http.routers.smtp-keys.middlewares=cors-headers@file,auth-check@file"
      - "traefik.http.routers.smtp-keys.tls=true"

      # POST /api/v2/service/emails — межсервисная отправка.
      # Аутентификация идёт по API-ключу в самом сервисе.
      - "traefik.http.routers.smtp-service-api.rule=Host(`realtimemap.ru`) && PathPrefix(`/api/v2/service/emails`)"
      - "traefik.http.routers.smtp-service-api.entrypoints=websecure"
      - "traefik.http.routers.smtp-service-api.priority=100"
      - "traefik.http.routers.smtp-service-api.service=smtp"
      - "traefik.http.routers.smtp-service-api.middlewares=cors-headers@file"
      - "traefik.http.routers.smtp-service-api.tls=true"

      # GET /smtp/health — health check (публичный)
      - "traefik.http.routers.smtp-health.rule=Host(`realtimemap.ru`) && Path(`/smtp/health`) && Method(`GET`)"
      - "traefik.http.routers.smtp-health.entrypoints=websecure"
      - "traefik.http.routers.smtp-health.priority=10"
      - "traefik.http.routers.smtp-health.service=smtp"
      - "traefik.http.routers.smtp-health.middlewares=cors-headers@file"
      - "traefik.http.routers.smtp-health.tls=true"

      - "traefik.http.services.smtp.loadbalancer.server.port=8080"
    environment:
      # Внутри сети брокер слушает INTERNAL-листенер на 9092; 9093 анонсирован
      # как localhost:9093 и из контейнера недоступен.
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPICS: "user-service,comment-service.events"
      KAFKA_GROUP_ID: "smtp-service"

      # UserService поднимает auth-сервис (Python) в сети service-network.
      USER_GRPC_ADDRESS: "grpc-container:50052"
      FRONTEND_BASE_URL: "https://realtimemap.ru"

      # Секреты и креды БД задаются в окружении хоста, а не в этом файле:
      # он коммитится в git.
      DB_HOST: "${DB_HOST:?DB_HOST is required}"
      DB_NAME: "${SMTP_DB_NAME:-rtm_smtp}"
      DB_USER: "${DB_USER:?DB_USER is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      SMTP_USERNAME: "${SMTP_USERNAME:?SMTP_USERNAME is required}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:?SMTP_PASSWORD is required}"
      SMTP_FROM: "${SMTP_FROM:-}"
      WORKER_DAILY_LIMIT: "${SMTP_DAILY_LIMIT:-450}"
    volumes:
      # Именно docker-config.yaml: config.yaml держит локальные адреса и
      # секреты в открытом виде и в образ попадать не должен.
      - ./config/docker-config.yaml:/app/config/config.yaml:ro
    networks:
      - web
      - service-network
      - kafka-network

networks:
  web:
    external: true
  service-network:
    external: true
    name: service-network
  kafka-network:
    external: true
