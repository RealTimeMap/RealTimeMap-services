server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip сжатие для статики
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Ассеты сборки Vite: в имени хэш содержимого, поэтому их можно кэшировать навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Документация обновляется без пересборки ссылок — браузер обязан перепроверять
    # каждый запрос (по ETag придёт 304, если файл не менялся)
    location /docs-data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback — все маршруты ведут на index.html. index.html и файлы без хэша
    # (favicon, icons) не кэшируются, иначе после деплоя подтянется старая сборка
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Health-check endpoint
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
