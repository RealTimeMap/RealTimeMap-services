services:
  social-service:
    build:
      context: ../..
      dockerfile: services/social-service/Dockerfile
    container_name: social-service
    restart: always
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-retries: "3"
    labels:
      - "traefik.enable=true"

      # CORS preflight OPTIONS для /api/v2/profile/*
      - "traefik.http.routers.social-options.rule=Host(`realtimemap.ru`) && PathPrefix(`/api/v2/profile/`) && Method(`OPTIONS`)"
      - "traefik.http.routers.social-options.entrypoints=websecure"
      - "traefik.http.routers.social-options.priority=200"
      - "traefik.http.routers.social-options.service=social"
      - "traefik.http.routers.social-options.middlewares=cors-headers@file"
      - "traefik.http.routers.social-options.tls=true"

      # GET /api/v2/profile/me - мой профиль (с auth)
      - "traefik.http.routers.social-me.rule=Host(`realtimemap.ru`) && Path(`/api/v2/profile/me`) && Method(`GET`) || Method(`PATCH`)"
      - "traefik.http.routers.social-me.entrypoints=websecure"
      - "traefik.http.routers.social-me.priority=100"
      - "traefik.http.routers.social-me.service=social"
      - "traefik.http.routers.social-me.middlewares=cors-headers@file,auth-check@file"
      - "traefik.http.routers.social-me.tls=true"

      # GET /api/v2/profile/search - поиск профилей (публичный)
      - "traefik.http.routers.social-search.rule=Host(`realtimemap.ru`) && Path(`/api/v2/profile/search`) && Method(`GET`)"
      - "traefik.http.routers.social-search.entrypoints=websecure"
      - "traefik.http.routers.social-search.priority=100"
      - "traefik.http.routers.social-search.service=social"
      - "traefik.http.routers.social-search.middlewares=cors-headers@file"
      - "traefik.http.routers.social-search.tls=true"

      # GET /api/v2/profile/:profileID - детали профиля (публичный)
      - "traefik.http.routers.social-detail.rule=Host(`realtimemap.ru`) && PathRegexp(`/api/v2/profile/[0-9]+$`) && Method(`GET`)"
      - "traefik.http.routers.social-detail.entrypoints=websecure"
      - "traefik.http.routers.social-detail.priority=90"
      - "traefik.http.routers.social-detail.service=social"
      - "traefik.http.routers.social-detail.middlewares=cors-headers@file"
      - "traefik.http.routers.social-detail.tls=true"

      # GET /api/v2/profile/:profileID/statistics/{summary,monthly,heatmap} - статистика профиля (публичный)
      - "traefik.http.routers.social-statistics.rule=Host(`realtimemap.ru`) && PathRegexp(`/api/v2/profile/[0-9]+/statistics/(summary|monthly|heatmap|categories)$`) && Method(`GET`)"
      - "traefik.http.routers.social-statistics.entrypoints=websecure"
      - "traefik.http.routers.social-statistics.priority=95"
      - "traefik.http.routers.social-statistics.service=social"
      - "traefik.http.routers.social-statistics.middlewares=cors-headers@file"
      - "traefik.http.routers.social-statistics.tls=true"

      # Static files (store) — только фотографии social-service
      - "traefik.http.routers.social-store.rule=Host(`realtimemap.ru`) && PathPrefix(`/store/photos/avatars`)"
      - "traefik.http.routers.social-store.entrypoints=websecure"
      - "traefik.http.routers.social-store.priority=10"
      - "traefik.http.routers.social-store.service=social"
      - "traefik.http.routers.social-store.middlewares=cors-headers@file"
      - "traefik.http.routers.social-store.tls=true"


      # GET /social/health
      - "traefik.http.routers.social-health.rule=Host(`realtimemap.ru`) && Path(`/social/health`) && Method(`GET`)"
      - "traefik.http.routers.social-health.entrypoints=websecure"
      - "traefik.http.routers.social-health.priority=10"
      - "traefik.http.routers.social-health.service=social"
      - "traefik.http.routers.social-health.middlewares=cors-headers@file"
      - "traefik.http.routers.social-health.tls=true"

      # ===== ЧАТЫ (/api/v2/chats) =====

      # CORS preflight OPTIONS для чата — без auth-check (браузер шлёт OPTIONS без
      # Authorization, auth-check завернул бы его на 401).
      - "traefik.http.routers.social-chats-options.rule=Host(`realtimemap.ru`) && PathPrefix(`/api/v2/chats`) && Method(`OPTIONS`)"
      - "traefik.http.routers.social-chats-options.entrypoints=websecure"
      - "traefik.http.routers.social-chats-options.priority=210"
      - "traefik.http.routers.social-chats-options.service=social"
      - "traefik.http.routers.social-chats-options.middlewares=cors-headers@file"
      - "traefik.http.routers.social-chats-options.tls=true"

      # GET /api/v2/chats — список чатов пользователя (точный путь без слэша)
      - "traefik.http.routers.social-chats-list.rule=Host(`realtimemap.ru`) && Path(`/api/v2/chats`) && Method(`GET`)"
      - "traefik.http.routers.social-chats-list.entrypoints=websecure"
      - "traefik.http.routers.social-chats-list.priority=120"
      - "traefik.http.routers.social-chats-list.service=social"
      - "traefik.http.routers.social-chats-list.middlewares=cors-headers@file,auth-check@file"
      - "traefik.http.routers.social-chats-list.tls=true"

      # /api/v2/chats/* — вложенные пути чата (direct, group, messages, history)
      - "traefik.http.routers.social-chats.rule=Host(`realtimemap.ru`) && PathPrefix(`/api/v2/chats/`)"
      - "traefik.http.routers.social-chats.entrypoints=websecure"
      - "traefik.http.routers.social-chats.priority=100"
      - "traefik.http.routers.social-chats.service=social"
      - "traefik.http.routers.social-chats.middlewares=cors-headers@file,auth-check@file"
      - "traefik.http.routers.social-chats.tls=true"

      # ===== ДРУЗЬЯ И БЛОКИРОВКИ (/api/v2/friends) =====

      # CORS preflight OPTIONS для друзей — без auth-check.
      - "traefik.http.routers.social-friends-options.rule=Host(`realtimemap.ru`) && PathPrefix(`/api/v2/friends`) && Method(`OPTIONS`)"
      - "traefik.http.routers.social-friends-options.entrypoints=websecure"
      - "traefik.http.routers.social-friends-options.priority=210"
      - "traefik.http.routers.social-friends-options.service=social"
      - "traefik.http.routers.social-friends-options.middlewares=cors-headers@file"
      - "traefik.http.routers.social-friends-options.tls=true"

      # GET /api/v2/friends — список друзей (точный путь без слэша)
      - "traefik.http.routers.social-friends-list.rule=Host(`realtimemap.ru`) && Path(`/api/v2/friends`) && Method(`GET`)"
      - "traefik.http.routers.social-friends-list.entrypoints=websecure"
      - "traefik.http.routers.social-friends-list.priority=120"
      - "traefik.http.routers.social-friends-list.service=social"
      - "traefik.http.routers.social-friends-list.middlewares=cors-headers@file,auth-check@file"
      - "traefik.http.routers.social-friends-list.tls=true"

      # /api/v2/friends/* — заявки, блокировки, список заблокированных
      # (request, accept, decline, remove, block, unblock, blocked)
      - "traefik.http.routers.social-friends.rule=Host(`realtimemap.ru`) && PathPrefix(`/api/v2/friends/`)"
      - "traefik.http.routers.social-friends.entrypoints=websecure"
      - "traefik.http.routers.social-friends.priority=100"
      - "traefik.http.routers.social-friends.service=social"
      - "traefik.http.routers.social-friends.middlewares=cors-headers@file,auth-check@file"
      - "traefik.http.routers.social-friends.tls=true"

      # /socket.io/* — WebSocket чата. auth-check валидирует Bearer на handshake и
      # вклеивает X-User-Id/X-User-Name; socket-сервер читает их из Handshake().Headers.
      # forwardAuth срабатывает на HTTP GET Upgrade — этого достаточно, дальше туннель.
      - "traefik.http.routers.social-socket.rule=Host(`realtimemap.ru`) && PathPrefix(`/socket.io/`)"
      - "traefik.http.routers.social-socket.entrypoints=websecure"
      - "traefik.http.routers.social-socket.priority=100"
      - "traefik.http.routers.social-socket.service=social"
      - "traefik.http.routers.social-socket.middlewares=cors-headers@file,auth-check@file"
      - "traefik.http.routers.social-socket.tls=true"

      # Service configuration
      - "traefik.http.services.social.loadbalancer.server.port=8080"

    networks:
      - web
      - service-network
      - internal-social
      - kafka-network
    volumes:
      - social_store_data:/app/store

volumes:
  social_store_data:

networks:
  web:
    external: true
  service-network:
    external: true
    name: service-network
  kafka-network:
    external: true
  internal-social: